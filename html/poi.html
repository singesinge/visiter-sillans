<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#13433F">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="manifest" href="/manifest.json">
  <title>POI — Visiter Sillans</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="poi-header">
  <button class="poi-back-btn" onclick="history.back()">←</button>
  <div>
    <div id="poi-header-num" style="font-size:0.75rem;opacity:0.7;font-family:var(--font-titre);text-transform:uppercase;letter-spacing:0.08em;"></div>
    <div id="poi-header-titre" style="font-weight:700;font-family:var(--font-titre);font-size:1.1rem;text-transform:uppercase;"></div>
  </div>
</header>

<main class="poi-body animate-in">
  <div id="poi-content">
    <!-- Chargement dynamique -->
    <p style="color:var(--gris);text-align:center;padding:2rem;">Chargement...</p>
  </div>
</main>

<script src="../js/progress.js"></script>
<script src="../js/app.js"></script>
<script src="../js/poi.js"></script>
<script src="../js/transitions.js"></script>
</body>
</html>
