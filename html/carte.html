<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#13433F">
  <meta name="description" content="Carte interactive des 14 points d'intérêt de l'ENS de Sillans-la-Cascade.">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <title>Carte — Visiter Sillans-la-Cascade</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; }
    #map { flex: 1; min-height: 0; }
    .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.18); }
    .popup-content { padding: 0.25rem; min-width: 160px; }
    .popup-num { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #6B7280; margin-bottom: 0.1rem; }
    .popup-titre { font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700; text-transform: uppercase; color: #13433F; margin-bottom: 0.5rem; }
    .popup-btn { display: block; background: #13433F; color: #F7F6F2; text-align: center; border-radius: 999px; padding: 0.4rem 0.75rem; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; text-decoration: none; }
  </style>
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="app-header__logo" aria-label="Retour à l'accueil">
    <img src="../img/logo-03.png" alt="Visiter Sillans"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'">
    <span class="app-header__logo-fallback">Visiter <strong>Sillans</strong></span>
  </a>
  <button class="burger-btn" id="burger-btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-drawer">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>
<nav class="nav-drawer" id="nav-drawer" aria-label="Menu principal">
  <div class="nav-drawer__header">
    <div style="flex:1;display:flex;align-items:center;">
      <img src="../img/logo-03.png" alt="Visiter Sillans" style="height:34px;"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <span class="nav-drawer__header-fallback">Visiter <strong>Sillans</strong></span>
    </div>
    <button class="nav-drawer__close" id="nav-close" aria-label="Fermer le menu">✕</button>
  </div>
  <p class="nav-drawer__section">Navigation</p>
  <ul class="nav-drawer__links">
    <li><a href="carte.html" class="nav-drawer__item active" aria-current="page"><span class="nav-drawer__item-icon" aria-hidden="true">🗺️</span>Carte du parcours</a></li>
    <li><a href="regles.html" class="nav-drawer__item"><span class="nav-drawer__item-icon" aria-hidden="true">📋</span>Règles de visite</a></li>
    <li><a href="qcm.html" class="nav-drawer__item"><span class="nav-drawer__item-icon" aria-hidden="true">🎯</span>Quiz</a></li>
    <li><a href="a-propos.html" class="nav-drawer__item"><span class="nav-drawer__item-icon" aria-hidden="true">ℹ️</span>À propos</a></li>
  </ul>
  <div class="nav-drawer__footer">ENS · Département du Var</div>
</nav>

<div class="legende" role="list" aria-label="Légende des thèmes">
  <div class="legende-item" role="listitem"><div class="legende-dot dot-biodiversite" aria-hidden="true"></div>Biodiversité</div>
  <div class="legende-item" role="listitem"><div class="legende-dot dot-geologie" aria-hidden="true"></div>Géologie</div>
  <div class="legende-item" role="listitem"><div class="legende-dot dot-histoire" aria-hidden="true"></div>Histoire</div>
  <div class="legende-item" role="listitem"><div class="legende-dot dot-securite" aria-hidden="true"></div>Sécurité</div>
  <span class="carte-progress" id="progress-display" aria-live="polite" style="margin-left:auto;">0 / 14</span>
</div>

<main id="map" aria-label="Carte interactive des points d'intérêt"></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/progress.js"></script>
<script src="../js/app.js"></script>
<script src="../js/carte.js"></script>
<script src="../js/proximity.js"></script>
</body>
</html>
