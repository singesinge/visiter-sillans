<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#13433F">
  <meta name="description" content="Carte interactive des 14 points d'intérêt de l'ENS de Sillans-la-Cascade.">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="manifest" href="/manifest.json">
  <title>Carte · Visiter Sillans-la-Cascade</title>
  <link rel="stylesheet" href="../css/style.css?v=12">
  <style>
    /* --- Layout plein écran --- */
    html, body { margin: 0; padding: 0; overflow: hidden; }
    /* 100dvh = hauteur réellement visible sur mobile (exclut la barre du navigateur),
       avec repli 100vh pour les navigateurs sans support dvh. */
    html { height: 100vh; height: 100dvh; }
    body {
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding-top: var(--header-height);
      box-sizing: border-box;
    }

    /* --- Zone carte --- */
    #carte-main {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    #carte-viewport {
      width: 100%; height: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background: #1E4A18;
    }
    #carte-viewport.is-dragging { cursor: grabbing; }

    /* --- Wrapper carte (transform appliqué ici) --- */
    #map-wrapper {
      position: absolute;
      top: 0; left: 0;
      width: 1508.72px;
      height: 2915.79px;
      transform-origin: 0 0;
      will-change: transform;
    }
    #map-img {
      width: 1508.72px;
      height: 2915.79px;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    /* --- Overlay markers (position écran, hors transform) --- */
    #poi-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* --- Marqueurs POI --- */
    .poi-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: all;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }
    .poi-pin__bubble {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 3px solid white;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-titre);
      font-size: 15px; font-weight: 700;
      box-shadow: 0 3px 12px rgba(0,0,0,0.35);
      transition: transform 0.12s ease;
      will-change: transform;
    }
    .poi-pin:active .poi-pin__bubble { transform: scale(0.86); }
    .poi-pin--visite .poi-pin__bubble { opacity: 0.48; }

    /* --- Marqueur DÉPART (POI 1) : goutte distincte + halo + étiquette --- */
    .poi-pin--depart { z-index: 15; }
    .poi-pin--depart .poi-pin__bubble {
      width: 46px; height: 46px;
      border-radius: 50% 50% 50% 0;        /* forme « goutte » de repère */
      transform: rotate(-45deg);
      border-width: 3px;
      font-size: 18px;
      animation: depart-pulse 2s ease-in-out infinite;
    }
    .poi-pin--depart .poi-pin__num { display: block; transform: rotate(45deg); }
    .poi-pin--depart:active .poi-pin__bubble { transform: rotate(-45deg) scale(0.9); }

    .poi-pin__depart-label {
      position: absolute;
      top: 100%; left: 50%;
      transform: translate(-50%, 8px);
      background: var(--vert-profond);
      color: #fff;
      font-family: var(--font-titre);
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      pointer-events: none;
    }
    @keyframes depart-pulse {
      0%, 100% { box-shadow: 0 3px 12px rgba(0,0,0,0.35), 0 0 0 0 rgba(166,206,57,0.55); }
      50%       { box-shadow: 0 3px 12px rgba(0,0,0,0.35), 0 0 0 11px rgba(166,206,57,0); }
    }

    /* --- Marqueur GPS utilisateur --- */
    #gps-dot {
      position: absolute;
      width: 18px; height: 18px;
      background: #2CA6A4;
      border: 3px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
      z-index: 20;
      animation: gps-pulse 2.4s ease-in-out infinite;
    }
    @keyframes gps-pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(44,166,164,0.3); }
      50%       { box-shadow: 0 0 0 12px rgba(44,166,164,0.06); }
    }

    /* --- Bouton GPS (FAB) --- */
    .gps-fab {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 16px;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: white;
      border: none;
      box-shadow: 0 2px 14px rgba(0,0,0,0.18);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 30;
      color: var(--vert-profond);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .gps-fab:active { transform: scale(0.92); box-shadow: 0 1px 6px rgba(0,0,0,0.12); }
    .gps-fab.active { color: #2CA6A4; }

    /* --- Popup bas de page --- */
    .poi-popup {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--blanc-casse);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 28px rgba(0,0,0,0.16);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34, 1.06, 0.64, 1);
      z-index: 200;
      max-height: 68vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .poi-popup.visible { transform: translateY(0); }

    .poi-popup__handle {
      width: 38px; height: 4px;
      background: #D1D5DB;
      border-radius: 2px;
      margin: 12px auto 0;
    }
    .poi-popup__inner { padding: 1rem 1.25rem 2.5rem; }
    .poi-popup__header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.7rem;
    }
    .poi-popup__meta { display: flex; align-items: center; gap: 0.5rem; }
    .poi-badge {
      display: inline-block;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      font-family: var(--font-titre);
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .poi-popup__num {
      font-family: var(--font-titre);
      font-size: 0.78rem;
      color: var(--gris);
      font-weight: 600;
    }
    .poi-popup__close {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--gris-clair);
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--gris);
      cursor: pointer;
      flex-shrink: 0;
    }
    .poi-popup__titre {
      font-size: 1.4rem;
      color: var(--vert-profond);
      margin-bottom: 0.45rem;
      line-height: 1.15;
    }
    .poi-popup__desc {
      font-size: 0.9rem;
      color: #4B5563;
      line-height: 1.6;
      margin-bottom: 1.2rem;
    }

    /* --- Sheet détail POI --- */
    .poi-detail {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--blanc-casse);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 32px rgba(0,0,0,0.22);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.06, 0.64, 1);
      z-index: 300;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .poi-detail.visible { transform: translateY(0); }

    .poi-detail__handle {
      width: 38px; height: 4px;
      background: #D1D5DB;
      border-radius: 2px;
      margin: 12px auto 0;
      flex-shrink: 0;
    }
    .poi-detail__header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.25rem 0.5rem;
      flex-shrink: 0;
    }
    .poi-detail__meta { display: flex; align-items: center; gap: 0.5rem; }
    .poi-detail__close {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--gris-clair);
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--gris);
      cursor: pointer;
      flex-shrink: 0;
    }
    .poi-detail__scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      min-height: 0;
    }
    .poi-detail__photo {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: var(--gris-clair);
    }
    .poi-detail__photo-placeholder {
      width: 100%; height: 160px;
      background: linear-gradient(135deg, #2d5a27 0%, #4a8c3f 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .poi-detail__body { padding: 1.1rem 1.25rem 2.5rem; }
    .poi-detail__titre {
      font-size: 1.45rem;
      color: var(--vert-profond);
      margin-bottom: 0.4rem;
      line-height: 1.15;
    }
    .poi-detail__desc {
      font-size: 0.9rem;
      color: #4B5563;
      line-height: 1.6;
      margin-bottom: 1.1rem;
    }
    .poi-detail__section-label {
      font-family: var(--font-titre);
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--vert-profond);
      margin-bottom: 0.45rem;
    }
    .poi-detail__contenu {
      font-size: 0.88rem;
      color: #374151;
      line-height: 1.65;
      margin-bottom: 1.2rem;
    }
    .poi-detail__conseil {
      background: #f0f7ee;
      border-left: 3px solid var(--vert-doux);
      border-radius: 0 8px 8px 0;
      padding: 0.75rem 1rem;
      font-size: 0.86rem;
      color: #2d4a2a;
      line-height: 1.55;
      font-style: italic;
      margin-bottom: 1.2rem;
    }
    /* --- Encadré « Le bon geste » mis en avant --- */
    .poi-conseil-card {
      background: linear-gradient(135deg, rgba(166,206,57,0.20), rgba(166,206,57,0.07));
      border: 1.5px solid rgba(166,206,57,0.55);
      border-radius: 14px;
      padding: 0.9rem 1rem 1rem;
      margin: 0 0 1.4rem;
    }
    .poi-conseil-card__head {
      display: flex; align-items: center; gap: 0.55rem;
      margin-bottom: 0.5rem;
    }
    .poi-conseil-card__icon {
      width: 30px; height: 30px; flex-shrink: 0;
      background: var(--lime); color: #2d4000;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .poi-conseil-card__label {
      font-family: var(--font-titre);
      font-size: 0.82rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: #3d5200;
    }
    .poi-conseil-card__text {
      font-size: 0.92rem; color: #2d4a2a; line-height: 1.6;
    }
    .poi-detail__especes {
      list-style: none;
      padding: 0; margin: 0 0 1.2rem;
    }
    .poi-detail__especes li {
      font-size: 0.82rem;
      color: #4B5563;
      font-style: italic;
      padding: 0.25rem 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .poi-detail__especes li:last-child { border-bottom: none; }

    /* --- Lecteur audio POI --- */
    .poi-audio {
      display: flex; align-items: center; gap: 12px;
      background: #eef6ee;
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 1.2rem;
    }
    .poi-audio.hidden { display: none; }
    .poi-audio__btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--vert-profond); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; flex-shrink: 0;
      transition: transform 0.12s, background 0.15s;
    }
    .poi-audio__btn:active { transform: scale(0.88); }
    .poi-audio__btn.playing { background: #2CA6A4; }
    .poi-audio__track { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .poi-audio__label { font-family: var(--font-titre); font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--vert-profond); }
    .poi-audio__bar {
      height: 4px; background: #d1d5db; border-radius: 2px;
      cursor: pointer; position: relative;
    }
    .poi-audio__fill {
      height: 100%; background: var(--vert-profond); border-radius: 2px;
      width: 0%; transition: width 0.15s linear; pointer-events: none;
    }
    .poi-audio__time {
      font-size: 0.72rem; color: var(--gris);
      font-family: var(--font-titre); flex-shrink: 0; min-width: 32px; text-align: right;
    }
  </style>
</head>

<!-- ===== CARTE ===== -->
<main id="carte-main" aria-label="Carte interactive des points d'intérêt">
  <div id="carte-viewport">

    <!-- Image SVG + transform pan/zoom -->
    <div id="map-wrapper">
      <img id="map-img" src="../img/Map.svg" alt="Carte illustrée du parcours Sillans-la-Cascade" draggable="false">

    <!-- Canvas chemin entre POI -->

        <circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="2"  x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2"  y1="12" x2="6"  y2="12"/>
        <line x1="18" y1="12" x2="22" y2="12"/>
      </svg>
    </button>

  </div><!-- #carte-viewport -->
</main>

<!-- ===== POPUP BAS DE PAGE ===== -->

    <div class="poi-popup__header">

<!-- ===== SHEET DÉTAIL POI ===== -->
<div id="poi-detail" class="poi-detail" role="dialog" aria-modal="true" aria-labelledby="detail-titre" aria-hidden="true">
  <div class="poi-detail__handle" id="detail-handle"></div>
  <div class="poi-detail__header">
    <div class="poi-detail__meta">
      <span id="detail-badge" class="poi-badge"></span>
      <span id="detail-num" class="poi-popup__num"></span>
    </div>
    <button class="poi-detail__close" id="detail-close-btn" aria-label="Fermer">✕</button>
  </div>
  <div class="poi-detail__scroll" id="detail-scroll">
    <div id="detail-photo-wrap"></div>
    <div class="poi-detail__body">
      <h2 id="detail-titre" class="poi-detail__titre"></h2>

      <!-- Lecteur audio narration -->
      <div class="poi-audio hidden" id="detail-audio-wrap">
        <button class="poi-audio__btn" id="audio-play-btn" aria-label="Lire la narration">
          <!-- play icon -->
          <svg id="audio-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <!-- pause icon -->
          <svg id="audio-icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <div class="poi-audio__track">
          <span class="poi-audio__label">🎧 Écouter la description</span>
          <div class="poi-audio__bar" id="audio-bar">
            <div class="poi-audio__fill" id="audio-fill"></div>
          </div>
        </div>
        <span class="poi-audio__time" id="audio-time">0:00</span>
        <audio id="detail-audio" preload="none"></audio>
      </div>

      <p id="detail-desc" class="poi-detail__desc"></p>

      <!-- Le bon geste : message clé, mis en avant juste sous l'intro -->
      <div id="detail-conseil-wrap" class="poi-conseil-card">
