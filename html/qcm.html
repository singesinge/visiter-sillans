<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#13433F">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="manifest" href="/manifest.json">
  <title>Quiz · Visiter Sillans</title>
  <link rel="stylesheet" href="../css/style.css?v=12">
</head>
<body>

<header class="app-header">
  <a href="../index.html" class="app-header__logo" aria-label="Retour à l'accueil">
    <img src="../img/logo-03.png" alt="Visiter Sillans"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'">
    <span class="app-header__logo-fallback">Visiter <strong>Sillans</strong></span>
  </a>
  <button class="burger-btn" id="burger-btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-drawer">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>
<nav class="nav-drawer" id="nav-drawer" aria-label="Menu principal">
  <div class="nav-drawer__header">
    <div style="flex:1;display:flex;align-items:center;">
      <img src="../img/logo-03.png" alt="Visiter Sillans" style="height:34px;"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <span class="nav-drawer__header-fallback">Visiter <strong>Sillans</strong></span>
    </div>
    <button class="nav-drawer__close" id="nav-close" aria-label="Fermer le menu">✕</button>
  </div>
  <p class="nav-drawer__section">Navigation</p>
  <ul class="nav-drawer__links">
    <li><a href="../index.html" class="nav-drawer__item"><span class="nav-drawer__item-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>Accueil</a></li>
    <li><a href="carte.html" class="nav-drawer__item"><span class="nav-drawer__item-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg></span>Carte du parcours</a></li>
    <li><a href="regles.html" class="nav-drawer__item"><span class="nav-drawer__item-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span>Règles de visite</a></li>
    <li><a href="qcm.html" class="nav-drawer__item active" aria-current="page"><span class="nav-drawer__item-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></span>Quiz</a></li>
    <li><a href="a-propos.html" class="nav-drawer__item"><span class="nav-drawer__item-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>À propos</a></li>
  </ul>
  <div class="nav-drawer__footer">ENS · Département du Var</div>
</nav>

<div class="qcm-sub-header">
  <span>Quiz naturaliste</span>
  <span>Q. <span id="q-actuelle">1</span> / <span id="q-total">10</span></span>
</div>

<main class="qcm-body animate-in" id="zone-quiz">
  <div class="qcm-dots" id="dots-container"></div>
  <p class="qcm-question" id="question-texte">Chargement...</p>
  <div class="reponses-grid" id="reponses-container"></div>
  <div class="qcm-explication" id="explication">
    <div class="qcm-explication__head">
      <span class="qcm-explication__icon" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </span>
      <span class="qcm-explication__label">À retenir</span>
    </div>
    <p id="explication-text" class="qcm-explication__text"></p>
  </div>
  <button class="btn btn-primary btn-full btn-suivant" id="btn-suivant" onclick="questionSuivante()">
    Question suivante →
  </button>
  <div class="qcm-mascotte" aria-hidden="true">
    <img src="../img/mascotte-06.svg" alt="" onerror="this.style.display='none'">
  </div>
</main>

<div class="score-screen" id="score-screen">
  <img class="score-screen__bg" src="../img/poi/poi-05.jpg" alt="" aria-hidden="true">
  <div class="score-mascotte">🦇</div>
  <div class="score-nombre" id="score-nombre">0/10</div>
  <div class="score-niveau" id="score-niveau">Découvreur</div>
  <p class="score-desc" id="score-desc"></p>
  <button class="btn btn-secondary btn-full" onclick="relancerQCM()" style="max-width:280px;margin:0 auto 0.75rem;">
    Rejouer
  </button>
  <a href="../index.html" class="btn btn-ghost btn-full" style="max-width:280px;margin:0 auto;">
    ← Retour à l'accueil
  </a>
</div>

<script src="../js/progress.js"></script>
<script src="../js/app.js"></script>
<script src="../js/qcm.js?v=2"></script>
<script src="../js/transitions.js"></script>
</body>
</html>
