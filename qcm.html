<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#13433F">
  <title>Quiz — Visiter Sillans</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="qcm-header">
  <div>
    <div style="font-size:0.75rem;opacity:0.7;font-family:var(--font-titre);text-transform:uppercase;letter-spacing:0.08em;">Quiz naturaliste</div>
    <div style="font-family:var(--font-titre);font-size:1.1rem;font-weight:700;text-transform:uppercase;">
      Question <span id="q-actuelle">1</span> / <span id="q-total">10</span>
    </div>
  </div>
</header>

<!-- Zone quiz -->
<main class="qcm-body animate-in" id="zone-quiz">
  <div class="qcm-dots" id="dots-container"></div>
  <p class="qcm-question" id="question-texte">Chargement...</p>
  <div class="reponses-grid" id="reponses-container"></div>
  <div class="qcm-explication" id="explication"></div>
  <button class="btn btn-primary btn-full btn-suivant" id="btn-suivant" onclick="questionSuivante()">
    Question suivante →
  </button>
</main>

<!-- Écran résultat -->
<div class="score-screen" id="score-screen">
  <div class="score-mascotte">🦇</div>
  <div class="score-nombre" id="score-nombre">0/10</div>
  <div class="score-niveau" id="score-niveau">Découvreur</div>
  <p class="score-desc" id="score-desc"></p>
  <button class="btn btn-primary" onclick="relancerQCM()" style="margin:0 auto 1rem;">
    🔄 Recommencer
  </button>
  <a href="carte.html" class="btn btn-ghost" style="margin:0 auto;">
    ← Retour à la carte
  </a>
</div>

<nav class="bottom-nav">
  <a href="carte.html" class="nav-item">
    <span class="nav-icon">🗺️</span>
    <span>Carte</span>
  </a>
  <a href="regles.html" class="nav-item">
    <span class="nav-icon">📋</span>
    <span>Règles</span>
  </a>
  <a href="qcm.html" class="nav-item active">
    <span class="nav-icon">🎯</span>
    <span>Quiz</span>
  </a>
  <a href="a-propos.html" class="nav-item">
    <span class="nav-icon">ℹ️</span>
    <span>À propos</span>
  </a>
</nav>

<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="js/qcm.js"></script>
</body>
</html>
